# ISO 8583 Message Comparison Configuration
# This file controls which fields and subfields are ignored during comparison

# Field classification for impact assessment
field_classes:
  FINANCIAL:
    - "04" # Amount, Transaction
  SECURITY:
    - "52" # PIN Data
    - "53" # Security Related Control Information
    - "55" # Integrated Circuit Card System Related Data
  OPERATIONAL:
    - "07" # Date And Time, Transmission
    - "11" # Systems Trace Audit Number
    - "12" # Date And Time, Local Transaction
    - "33" # Forwarding Institution Identification Code

# Fields to completely ignore (entire field value is ignored)
# These fields will be marked as <IGNORED> in comparison
ignored_fields:
  - "11" # STAN - Systems Trace Audit Number (changes per transaction)
  # - "12" # Local Transaction Date/Time (uncomment to ignore)
  - "p" # Primary Bitmap

# Subfields to ignore within specific fields
# Format: field_number: [list of subfield identifiers]
ignored_subfields:
  "55":
    - "Transaction Date"
    - "Unpredictable Number"

  "12":
    - "Day"
